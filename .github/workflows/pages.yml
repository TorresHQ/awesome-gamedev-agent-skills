name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/generate-site.py'
      - 'scripts/check-site.py'
      - 'scripts/validate-skills.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: the build job, which runs repository code, can only read. Only the
# deploy job, which runs no repository code, can publish Pages and mint an OIDC token.
permissions:
  contents: read

# Let a queued run finish; never cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the site settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Skill names become output paths; validate them before generating the site.
      - name: Validate SKILL.md frontmatter and links
        run: python scripts/validate-skills.py

      - name: Generate pages from SKILL.md frontmatter
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/generate-site.py --base-url "$BASE_URL"

      - name: Check generated pages
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/check-site.py _site "$BASE_URL"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
